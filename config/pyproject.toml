[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-select = ["UP034", "SIM117"]

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
branch = true
source = ["${ASHAIY_TEST_ROOT?}/scripts"]
data_file = "${ASHAIY_TEST_ROOT?}/.cache/coverage/.coverage"
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "${ASHAIY_TEST_ROOT?}/.cache/coverage/html"

[tool.basedpyright]
include = ["../scripts", "../tests"]
extraPaths = [".."]
typeCheckingMode = "basic"
pythonVersion = "3.14"
