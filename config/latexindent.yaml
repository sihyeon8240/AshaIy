defaultIndent: '  '
verbatimEnvironments:
  lean: 1
# Preserve machine-readable comments and intentionally empty sections.
noIndentBlock:
  metadataComments:
    begin: '(?m)^\h*%(?=\h*(?:!|(?:BEGIN|END)\h+GENERATED\b|Generated\h+from\b|Lean\h+source:|$))'
    body: '[^\r\n]*'
    end: '(?m)(?=\r?$)'
lookForAlignDelims:
  aligned:
    delims: 1
    alignDoubleBackSlash: 1
    spacesBeforeDoubleBackSlash: 1
modifyLineBreaks:
  environments:
    BeginStartsOnOwnLine: 1
    BodyStartsOnOwnLine: 1
    EndStartsOnOwnLine: 1
  textWrapOptions:
    columns: 88
    removeBlockLineBreaks: 0
    when: after
    # Wrap each source line independently to preserve stable manual breaks.
    blocksEndBefore:
      other: '\n|\\begin\{|\\\[|\\end\{'
    blocksFollow:
      other: '\n|\\\]|\\item(?:\h|\[)|\\begin\{[^}]+\}(?:\h*\\label\{[^}]+\})?|\\label\{[^}]+\}'
    comments:
      wrap: 1
      inheritLeadingSpace: 1
