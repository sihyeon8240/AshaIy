schema_version: 1
macros:
  Gcd:
    kind: command
    arguments:
      - {kind: mandatory, mode: math}
    body: '\gcd\Paren*{#1}'
  Lcm:
    kind: command
    arguments:
      - {kind: mandatory, mode: math}
    body: '\operatorname{lcm}\Paren*{#1}'

  Ord:
    kind: command
    arguments:
      - {kind: mandatory, mode: math}
      - {kind: mandatory, mode: math}
    body: '\operatorname{ord}_{#1}\Paren*{#2}'
  Ind:
    kind: command
    arguments:
      - {kind: mandatory, mode: math}
      - {kind: mandatory, mode: math}
    body: '\operatorname{ind}_{#1}\Paren*{#2}'
