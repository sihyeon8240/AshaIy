name: Build or repository bug
description: Report a build, automation, or repository problem
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: "What happened and what did you expect?"
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps, description: Include commands and relevant output.}
    validations: {required: true}
  - type: input
    id: environment
    attributes: {label: Environment, description: OS, TeX image/version, and commit if known.}
