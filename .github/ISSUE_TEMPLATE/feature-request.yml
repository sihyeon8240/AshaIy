name: Feature request
description: Suggest new material or a repository improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: proposal
    attributes: {label: Proposal, description: Describe the change and the problem it solves.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes:
      label: Scope and alternatives
      description: Name affected textbooks and alternatives considered.
