name: Build or reuse toolchain image
on:
  workflow_call:
    inputs:
      ref:
        description: Git revision containing the image inputs
        required: true
        type: string
      tag:
        description: Content-addressed image tag
        required: true
        type: string
      validate_existing:
        description: Run current validation even when the content tag is published
        type: boolean
        default: false
      refresh_cache:
        description: Explicitly refresh intermediate caches for an existing image
        type: boolean
        default: false
    outputs:
      image:
        description: Tested registry or run-local image reference
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Tested index digest or local image ID without the sha256 prefix
        value: ${{ jobs.publish.outputs.digest }}
      artifact:
        description: Run-local AMD64 image artifact when registry publication is disabled
        value: ${{ jobs.publish.outputs.artifact }}
concurrency:
  group: toolchain-image-${{ inputs.tag }}
  cancel-in-progress: false
  queue: max
env:
  IMAGE_DESCRIPTION: Development and CI toolchain for AshaIy mathematics textbooks, including TeX Live, Lean, and Python.
jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.release-tag.outputs.exists }}
      tag: ${{ inputs.tag }}
      image: ${{ steps.release-tag.outputs.image }}
      digest: ${{ steps.release-tag.outputs.digest }}
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - name: Checkout image inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Load repository configuration
        run: ./scripts/repository/config/export_config.sh
      - name: Read the image build matrix
        id: policy
        run: |
          matrix="$(python3 scripts/toolchain/images/image_policy.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Select the content-addressed image tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # validation-pattern: image_tag
          [[ "$TAG" =~ ^texlive-[0-9a-f]{12}$ ]]
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an existing immutable image
        id: release-tag
        run: ./scripts/toolchain/images/check_image_tag.sh
  build:
    name: Validate toolchain (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.exists != 'true' || inputs.validate_existing
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout image inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Load repository configuration
        id: config
        run: ./scripts/repository/config/export_config.sh
      - name: Set the temporary image tag
        id: build-tag
        run: |
          build_tag="${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          echo "BUILD_TAG=$build_tag" >> "$GITHUB_ENV"
          echo "tag=$build_tag" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Restore a verified candidate from the merged PR
        id: candidate
        if: needs.prepare.outputs.exists != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/toolchain/images/image_candidate.py restore --arch "$ARCH" --image "$BUILD_TAG"
      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.config.outputs.image_name }}
          tags: type=raw,value=${{ needs.prepare.outputs.tag }}
          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published image for current validation
        if: needs.prepare.outputs.exists == 'true'
        env:
          PUBLISHED_IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          echo "Reusing $PUBLISHED_IMAGE for linux/$ARCH"
          docker pull --platform "linux/$ARCH" "$PUBLISHED_IMAGE"
          docker tag "$PUBLISHED_IMAGE" "$BUILD_TAG"
      - name: Build image for smoke testing
        if: needs.prepare.outputs.exists != 'true' && steps.candidate.outputs.reused != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./.devcontainer/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.build-tag.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ steps.config.outputs.image_name }}:buildcache-${{ matrix.arch }}
            type=registry,ref=${{ steps.config.outputs.image_name }}:latest
          cache-to: |
            type=inline
            ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', steps.config.outputs.image_name, matrix.arch) || '' }}
      - name: Smoke test the image toolchain
        run: |
          test "$(docker image inspect "$BUILD_TAG" --format '{{.Architecture}}')" = "$ARCH"
          docker run --rm --platform "linux/$ARCH" "$BUILD_TAG" ./scripts/toolchain/check_toolchain.sh
      - name: Build the Mathlib cache executable without existing Lean outputs
        run: |
          docker run --rm --platform "linux/$ARCH" \
            -v "$PWD:/workspace:ro" "$BUILD_TAG" bash -euo pipefail -c '
            ashaiy --version
            workspace="$(mktemp -d)"
            tar -C /workspace/lean --exclude=.lake -cf - . | tar -C "$workspace" -xf -
            cd "$workspace"
            lake exe cache --help
          '
      - name: Validate every checked textbook with the candidate
        run: |
          mkdir -p build
          docker run --rm -v "$PWD:/workspace" "$BUILD_TAG" bash -euo pipefail -c '
            git config --global --add safe.directory /workspace
            ./scripts/ashaiy book build --check --strict
          '
      - name: Validate native ARM64 rendering and site behavior
        if: matrix.arch == 'arm64'
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/workspace" "$BUILD_TAG" bash -euo pipefail -c '
            git config --global --add safe.directory /workspace
            REQUIRE_TEX_TESTS=1 python3 -m unittest discover -t . -s tests/latex -p test_code_fonts.py -v
            ./scripts/ashaiy site test
          '
      - name: Preserve the failed ARM64 browser trace
        if: failure() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-browser-trace-arm64
          path: build/test-results/site-layout-trace.zip
          if-no-files-found: ignore
      - name: Record PDFs checked with the run-local candidate
        if: needs.prepare.outputs.exists != 'true' && github.event_name == 'pull_request' && matrix.arch == 'amd64'
        run: |
          image_id="$(docker image inspect "$BUILD_TAG" --format '{{.Id}}')"
          docker run --rm -v "$PWD:/workspace" \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e CANDIDATE_IMAGE_ID="$image_id" "$BUILD_TAG" bash -euo pipefail -c '
            git config --global --add safe.directory /workspace
            books="$(python3 scripts/books/books.py list --for check)"
            while IFS= read -r book; do
              [[ -n "$book" ]] || continue
              python3 scripts/ci/verified_build.py record-candidate \
                --book "$book" --image "$CANDIDATE_IMAGE_ID"
            done <<< "$books"
          '
      - name: Upload candidate PDF validation results
        if: needs.prepare.outputs.exists != 'true' && github.event_name == 'pull_request' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-pdfs
          path: build/candidate-pdfs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Push the tested image and record its digest
        if: needs.prepare.outputs.exists != 'true' && github.event_name != 'pull_request'
        run: |
          docker push "$BUILD_TAG"
          digest="$(docker buildx imagetools inspect "$BUILD_TAG" --format '{{.Manifest.Digest}}')"
          # validation-pattern: image_digest
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p build/image-digests
          echo "${IMAGE_NAME}@${digest}" > "build/image-digests/${ARCH}"
      - name: Record the run-local tested image
        if: needs.prepare.outputs.exists != 'true' && github.event_name == 'pull_request'
        run: |
          mkdir -p build/image-digests
          docker image inspect "$BUILD_TAG" --format '{{.Id}}' > "build/image-digests/${ARCH}"
      - name: Export the tested image candidate
        if: needs.prepare.outputs.exists != 'true' && github.event_name == 'pull_request'
        run: |
          mkdir -p build/toolchain-image
          docker save "$BUILD_TAG" | gzip -1 > build/toolchain-image/image.tar.gz
          python3 scripts/toolchain/images/image_candidate.py record --arch "$ARCH" --image "$BUILD_TAG"
      - name: Upload the run-local tested image
        if: needs.prepare.outputs.exists != 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toolchain-image-${{ matrix.arch }}
          path: build/toolchain-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload the tested image digest
        if: needs.prepare.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: build/image-digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, build]
    concurrency:
      group: toolchain-image-publication
      cancel-in-progress: false
      queue: max
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' ||
      (needs.prepare.outputs.exists == 'true' && !inputs.validate_existing && needs.build.result == 'skipped'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
      artifact: ${{ steps.local.outputs.artifact }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout image inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Load repository configuration
        id: config
        run: ./scripts/repository/config/export_config.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck the index after waiting for publication
        id: registry
        if: needs.prepare.outputs.exists != 'true'
        run: ./scripts/toolchain/images/check_image_tag.sh
      - name: Download tested image digests
        if: needs.prepare.outputs.exists != 'true' && steps.registry.outputs.exists != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-digest-*
          path: build/image-digests
          merge-multiple: true
      - name: Extract Docker metadata
        if: >-
          needs.prepare.outputs.exists != 'true' &&
          steps.registry.outputs.exists != 'true' &&
          github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.config.outputs.image_name }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
      - name: Assemble the tested multi-platform index
        if: >-
          needs.prepare.outputs.exists != 'true' &&
          steps.registry.outputs.exists != 'true' &&
          github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sources=()
          architecture_list="$(python3 scripts/toolchain/images/image_policy.py architectures)"
          read -r -a architectures <<< "$architecture_list"
          for arch in "${architectures[@]}"; do
            source="$(cat "build/image-digests/$arch")"
            digest="${source#"${IMAGE_NAME}@"}"
            # validation-pattern: image_digest
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$source")
          done
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${IMAGE_DESCRIPTION}" \
            "${tags[@]}" "${sources[@]}"
      - name: Select the run-local image artifact
        id: local
        if: >-
          needs.prepare.outputs.exists != 'true' &&
          steps.registry.outputs.exists != 'true' &&
          github.event_name == 'pull_request'
        run: echo "artifact=toolchain-image-amd64" >> "$GITHUB_OUTPUT"
      - name: Resolve and validate the tested index digest
        id: image
        env:
          PUBLISHED_IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request && -f build/image-digests/amd64 ]]; then
            digest="$(cat build/image-digests/amd64)"
            # validation-pattern: image_digest
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"
            echo "image=${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IMAGE_REF="${PUBLISHED_IMAGE:-${IMAGE_NAME}:${RELEASE_TAG}}" \
            REQUIRE_IMAGE=true ./scripts/toolchain/images/check_image_tag.sh
      - name: Promote current main aliases and report image access
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ steps.image.outputs.image }}
        run: python3 scripts/toolchain/images/image_registry.py
  refresh-cache:
    needs: [prepare, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      needs.prepare.outputs.exists == 'true' && inputs.refresh_cache &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - id: config
        run: ./scripts/repository/config/export_config.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh intermediate stages without replacing the tested image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./.devcontainer/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=cacheonly
          cache-from: |
            type=registry,ref=${{ steps.config.outputs.image_name }}:buildcache-${{ matrix.arch }}
            type=registry,ref=${{ needs.publish.outputs.image }}
          cache-to: type=registry,ref=${{ steps.config.outputs.image_name }}:buildcache-${{ matrix.arch }},mode=max
