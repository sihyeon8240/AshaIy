name: Validate and publish toolchain image
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/prepare-image.yml
    with:
      ref: ${{ github.sha }}
      refresh_cache: true
